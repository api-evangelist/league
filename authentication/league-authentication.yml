summary: >-
  League provisions API Keys to contracted customers under the Developer Program Terms. There is no
  public authentication reference, no OpenAPI securitySchemes to derive from, and no OAuth or OIDC
  discovery document served on any League host.
schemes:
- type: apiKey
  name: API Key
  in: unknown
  description: >-
    The Developer Program Terms state that "Customers receive provisioned API Keys for authorized use
    cases" and that League "may monitor Customer's use of any API by the Customer Developed Apps
    through any technical means". The header or query parameter carrying the key is not published.
  method: searched
  evidence: https://league.com/developer-program-terms/
  provisioning: >-
    Per-customer, per-use-case. Annex 1 of the terms currently authorizes a single use case,
    "Embedding into Existing Applications".
oauth:
  present: false
  note: >-
    No OAuth 2.0 or OpenID Connect surface is discoverable. Probed and all missed:
    api.league.com/.well-known/oauth-authorization-server (404),
    api.league.com/.well-known/oauth-protected-resource (404),
    api.league.com/.well-known/openid-configuration (404),
    app.league.com/.well-known/openid-configuration (404).
    League's own documentation portal is fronted by Auth0
    (documentation-portal.leagueinc-prod-usa.auth0.com) but that is League's internal IdP for docs
    access, not an API authorization server exposed to integrators.
observed_behaviour:
