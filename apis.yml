aid: league
name: League
description: 'League is a Toronto-founded (2014) healthcare platform company whose Health OS powers consumer
  healthcare experiences for payers, providers, consumer health brands and employers, and which now positions
  itself as a healthcare-grade agentic experience platform shipping pre-built AI Agent Teams for benefits
  navigation, care navigation and health coaching. Its data platform is built on the HL7 FHIR standard,
  using FHIR resources such as QuestionnaireResponse and CarePlan to model both integrated healthcare
  data and member-generated data across a longitudinal health record. League runs a Developer Program
  that gives contracted customers SDKs, a server-driven UI framework, back-end extensions and data integrations
  for embedding League into existing applications. The platform API is served from a live Kong-fronted
  gateway at api.league.com that answers with the JSON:API media type, but neither the API reference nor
  any machine-readable contract is published publicly: the documentation portal sits behind an Auth0 login
  and developer access is granted through a contact-sales form.'
